server.port=${PORT:8080}
spring.application.name=Blister
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blister}
spring.datasource.username=${DB_USERNAME:pharmasure}
spring.datasource.password=${DB_PASSWORD:pharmasure}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:pharmasure@example.com}
spring.mail.password=${MAIL_PASSWORD:pharmasure_dummy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

gemini.api.key=${GEMINI_API_KEY:}
