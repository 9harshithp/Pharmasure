server.port=${PORT:8080}
spring.application.name=Blister

# Database Configuration (Environment Driven & Secure)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blister}
spring.datasource.username=${DB_USERNAME:pharmasure}
spring.datasource.password=${DB_PASSWORD:pharmasure}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Production Hardening / Disable Debug Mode & Leakage
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.devtools.restart.enabled=false

# Mail Service Credentials
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:pharmasure@example.com}
spring.mail.password=${MAIL_PASSWORD:pharmasure_dummy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# AI Service Configuration
gemini.api.key=${GEMINI_API_KEY:}

# Security & CORS Configuration
jwt.secret=${JWT_SECRET:pharmasure-secure-jwt-production-secret-token-key-2026-xyz}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://pharmasure-predictive-expiry-alerts-for.onrender.com,https://pharmasure-predictive-expiry-alerts-for-zero-risk-dispensing.vercel.app}
