# Spring Boot Server
server.port=${PORT:8080}
spring.application.name=Blister

# Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blister}
spring.datasource.username=${DB_USERNAME:pharmasure}
spring.datasource.password=${DB_PASSWORD:pharmasure}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

# SMTP Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# AI Services
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key}

# JWT & CORS
jwt.secret=${JWT_SECRET:generate_a_long_random_secret_for_production}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://your-domain.vercel.app}
